# Optional: refresh the forecasts snapshot in Supabase Storage (static mode).
# Unlike market-snapshot.yml (quotes, hits PSE EDGE directly), this reads
# market_bars_daily from Postgres, so it needs a DATABASE_URL secret with
# read access — see db/INGEST.md. Also needs SUPABASE_URL and
# SUPABASE_SERVICE_ROLE_KEY to publish the snapshot. Skips the run (not a
# hard failure) if secrets aren't configured, so forking/testing this
# workflow is safe. No git commit happens here — the ingest script publishes
# directly to Supabase Storage; the app reads it at request time.

name: Market forecasts snapshot

on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Check required secrets are configured
        id: has-secrets
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DATABASE_URL, SUPABASE_URL, or SUPABASE_SERVICE_ROLE_KEY not set — skipping forecasts snapshot refresh"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run ingest:forecasts:snapshot
        if: steps.has-secrets.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
